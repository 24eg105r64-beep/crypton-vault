<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Crypton</title>
  <link rel="stylesheet" th:href="@{/css/crypton.css}">
</head>
<body>
  <nav>
    <a class="brand" th:href="@{/}">Crypton</a>
    <a th:href="@{/login}">Sign in</a>
  </nav>

  <section class="hero split">
    <div>
      <span class="eyebrow">Create your vault</span>
      <h1>Begin.</h1>
      <p class="lead">It takes a minute. Your keys are created and kept on your own device.</p>
    </div>
    <div class="panel">
      <p th:if="${error}" th:text="${error}" style="color: red;"></p>
      <form th:action="@{/register}" th:object="${registerDto}" method="post">
        <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" style="color: red;"></p>

        <label for="name">Your name</label>
        <input type="text" id="name" th:field="*{name}">
        <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="width:100%;color:#8A4E38"></small>

        <label for="email" style="margin-top:1rem">Email</label>
        <input type="email" id="email" th:field="*{email}">
        <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="width:100%;color:#8A4E38"></small>

        <label for="phone" style="margin-top:1rem">Phone</label>
        <input type="text" id="phone" th:field="*{phone}" placeholder="10 digits">
        <small th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="width:100%;color:#8A4E38"></small>

        <label for="password" style="margin-top:1rem">Password</label>
        <input type="password" id="password" th:field="*{password}" placeholder="At least 8 characters">
        <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="width:100%;color:#8A4E38"></small>

        <label for="confirmPassword" style="margin-top:1rem">Confirm password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
        <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="width:100%;color:#8A4E38"></small>

        <button type="submit" style="margin-top:1.5rem">Create my vault</button>
      </form>
      <p style="margin-top:2rem"><small>Already have a vault? <a th:href="@{/login}">Sign in</a></small></p>
    </div>
  </section>
</body>
</html>
