# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=crypton
server.port=${PORT:8080}

# ===================================================================
# Local MySQL Database Configuration
# Target Database: crypton_db
# Replace 'your_username' and 'your_password' with your MySQL credentials
# or provide DB_USERNAME and DB_PASSWORD environment variables.
# ===================================================================
spring.datasource.url=jdbc:mysql://crypto-db-crypton-project.a.aivencloud.com:25534/crypton_db?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
