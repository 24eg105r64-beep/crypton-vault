# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=crypton
server.port=${PORT:8080}

# ===================================================================
# Local MySQL Database Configuration
# Target Database: crypton_db
# Replace 'your_username' and 'your_password' with your MySQL credentials
# or provide DB_USERNAME and DB_PASSWORD environment variables.
# ===================================================================
spring.datasource.url=jdbc:mysql://crypto-db-crypton-project.a.aivencloud.com:25534/crypton_db?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ===================================================================
# React frontend API (/api/**)
# Set these as environment variables on Render:
#   APP_TOKEN_SECRET          long random value used to sign sign-in tokens
#   APP_CORS_ALLOWED_ORIGINS  the React site's address, e.g. https://crypton-frontend.onrender.com
# Locally the defaults below are used (Vite dev server on port 5173).
# ===================================================================
app.token-secret=${APP_TOKEN_SECRET:local-development-only-secret-change-me}
app.token-ttl-hours=8
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
